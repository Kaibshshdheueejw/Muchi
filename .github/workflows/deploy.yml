# MUCHI — deploy to Cloudflare Workers (GitHub Actions + Wrangler).
#
# Branch mapping (staging-first, by design):
#   push to main   -> test + PRODUCTION deploy  (muchi.<account>.workers.dev)
#   push to other  -> test + STAGING deploy     (muchi-staging.<account>.workers.dev)
#   manual run     -> choose staging or production
#
# GitHub secrets required:
#   CLOUDFLARE_API_TOKEN  (Workers Scripts Edit, Workers R2 Edit, Workers KV
#                          Edit, D1 Edit, Account Settings Read)
#   CLOUDFLARE_ACCOUNT_ID
# Worker secrets (GOOGLE_CLIENT_ID/SECRET, GOOGLE_REDIRECT_URI,
# MUCHI_SESSION_SECRET) live only in Cloudflare — never in GitHub.

name: Deploy MUCHI Worker

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy target (default: staging)"
        type: choice
        default: staging
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Toolchain versions
        run: |
          node --version
          npm --version
          npx wrangler --version
      - name: Unit tests (pure, no network)
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Toolchain versions (deploy job)
        run: |
          node --version
          npm --version
          npx wrangler --version

      - name: Determine environment
        id: env
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "target=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "target=production" >> "$GITHUB_OUTPUT"
          else
            echo "target=staging" >> "$GITHUB_OUTPUT"
          fi
          echo "Target: $(cat $GITHUB_OUTPUT | grep '^target=' | cut -d= -f2)"

      - name: Cloudflare auth check (wrangler whoami)
        run: npx wrangler whoami

      - name: Preflight — workers.dev subdomain registered
        shell: bash
        run: |
          RESP=$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" || true)
          SUB=$(echo "$RESP" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const r=JSON.parse(d);console.log((r.result&&r.result.subdomain)||'')}catch{console.log('')}})")
          if [ -z "$SUB" ]; then
            echo "::error::workers.dev subdomain is NOT registered on this Cloudflare account. Register it once: dash.cloudflare.com → Workers & Pages → 'Create a Worker' (follow the subdomain prompt) → then re-run this workflow."
            exit 1
          fi
          echo "workers.dev subdomain: $SUB"

      - name: Ensure D1 + KV resources (idempotent)
        # MUST run before the dry-run: it patches the REPLACE_ME_* ids in
        # wrangler.toml with real D1/KV ids. The dry-run below then validates
        # the fully-resolved config. (Before this fix the dry-run always ran
        # against the placeholders and failed, so nothing ever deployed.)
        run: node scripts/setup.mjs --ci

      - name: Wrangler config check (dry-run)
        run: npx wrangler deploy --dry-run

      - name: Apply D1 migrations (staging)
        if: steps.env.outputs.target == 'staging'
        run: npx wrangler d1 migrations apply DB --remote --env staging

      - name: Apply D1 migrations (production)
        if: steps.env.outputs.target == 'production'
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy Worker (staging)
        if: steps.env.outputs.target == 'staging'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env staging
          workingDirectory: .

      - name: Deploy Worker (production)
        if: steps.env.outputs.target == 'production'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: .

      - name: Smoke test deployed Worker
        shell: bash
        run: |
          SUB=$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{console.log(JSON.parse(d).result.subdomain)})")
          NAME="${{ steps.env.outputs.target == 'staging' && 'muchi-staging' || 'muchi' }}"
          URL="https://${NAME}.${SUB}.workers.dev/api/health"
          echo "Smoke: $URL"
          curl -fsS "$URL" | grep -q '"ok":true' && echo "HEALTH OK" || { echo "HEALTH FAILED"; exit 1; }
          curl -fsS "https://${NAME}.${SUB}.workers.dev/" -o /dev/null && echo "APP SHELL OK"
